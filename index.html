<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title data-i18n="site.title"></title>
</head>

<body>
    <header class="Header">
        <nav class="HeaderNav" aria-label="Navegação principal">
            <a href="#home" data-i18n="header.home"></a>
            <a href="#experience" data-i18n="header.experience"></a>
            <a href="#languages" data-i18n="header.languages"></a>
            <a href="#education" data-i18n="header.education"></a>
            <a href="#projects" data-i18n="header.projects"></a>
            <a href="#contact" data-i18n="header.contact"></a>
        </nav>

        <div class="HeaderControls">
            <div class="ControlGroup" aria-label="Seleção de tema">
                <button type="button" class="ControlButton ThemeButton" data-theme="light" aria-label="Usar tema claro" > ☀ </button>
                <button type="button" class="ControlButton ThemeButton" data-theme="dark" aria-label="Usar tema escuro"> ☾ </button>
            </div>

            <div class="ControlGroup" aria-label="Seleção de idioma" >
                <button type="button" class="ControlButton LanguageButton" data-language="ptbr" aria-label="Português"> PT </button>
                <button type="button" class="ControlButton LanguageButton" data-language="en" aria-label="English"> EN </button>
            </div>
        </div>
    </header>

    <main>
        <section id="home" class="ContentSection">
            <div class="AboutMeContent">
                <p class="DevName" data-i18n="main.dev.name"></p>
                <p class="HomeDescription" data-i18n="main.dev.description"></p>
            </div>
            <div class="Technologies">
                <p class="TechnologiesDescription" data-i18n="main.dev.technologies"></p>
                <div class="TechnologiesContainer">
                    <div class="TechnologyCard">HTML</div>
                    <div class="TechnologyCard">CSS</div>
                    <div class="TechnologyCard">JavaScript</div>
                    <div class="TechnologyCard">Git</div>
                    <div class="TechnologyCard">Node.js</div>
                    <div class="TechnologyCard">Python</div>
                    <div class="TechnologyCard">Unity</div>
                    <div class="TechnologyCard">Unreal Engine</div>
                    <div class="TechnologyCard">C#</div>
                    <div class="TechnologyCard">C++</div>
                    <div class="TechnologyCard">Qlik Sense</div>
                    <div class="TechnologyCard">QlikView</div>
                    <div class="TechnologyCard">Qlik Cloud</div>
                    <div class="TechnologyCard">NPrinting</div>
                </div>
            </div>
        </section>

        <section id="experience" class="ContentSection">
                <h2 data-i18n="sections.experience"></h2>
                <div class="ExperienceCard">
                    <div class="ExperiencePrimary">
                        <img class="ExperienceLogo" src="images/BildenNegociosLogo.jpg" alt="Bilden Resultados com Inteligência" >
                        <div class="ExperienceInfo">
                            <h3 data-i18n="experience.bilden.name"></h3>
                            <p data-i18n="experience.bilden.period"></p>
                        </div>
                    </div>
                    <div class="ExperienceDivider"></div>
                    <p class="ExperienceDescription" data-i18n="experience.bilden.description" ></p>
                </div>

                <div class="ExperienceCard">
                    <div class="ExperiencePrimary">
                        <img class="ExperienceLogo" src="images/GEOvendas.jpg" alt="GEOvendas" >
                        <div class="ExperienceInfo">
                            <h3 data-i18n="experience.geovendas.name"></h3>
                            <p data-i18n="experience.geovendas.period"></p>
                        </div>
                    </div>
                    <div class="ExperienceDivider"></div>
                    <p class="ExperienceDescription" data-i18n="experience.geovendas.description" ></p>
                </div>

                <div class="ExperienceCard">
                    <div class="ExperiencePrimary">
                        <img class="ExperienceLogo" src="images/BytecomLogo.jpg" alt="Bytecom Sistemas" >
                        <div class="ExperienceInfo">
                            <h3 data-i18n="experience.bytecom.name"></h3>
                            <p data-i18n="experience.bytecom.period"></p>
                        </div>
                    </div>
                    <div class="ExperienceDivider"></div>
                    <p class="ExperienceDescription" data-i18n="experience.bytecom.description" ></p>
                </div>

                <div class="ExperienceCard">
                    <div class="ExperiencePrimary">
                        <img class="ExperienceLogo" src="images/DessisLogo.jpg" alt="Dessis Sistemas" >
                        <div class="ExperienceInfo">
                            <h3 data-i18n="experience.dessis.name"></h3>
                            <p data-i18n="experience.dessis.period"></p>
                        </div>
                    </div>
                    <div class="ExperienceDivider"></div>
                    <p class="ExperienceDescription" data-i18n="experience.dessis.description" ></p>
                </div>
        </section>

        <section id="languages" class="ContentSection">
                <h2 data-i18n="sections.languages"></h2>
                <div class="LanguageCard">
                    <div class="LanguagePrimary">
                        <img class="LanguageFlag" src="images/BrazilIcon.png" alt="Brazil icon" >
                        <div class="LanguageInfo">
                            <h3 data-i18n="languages.portuguese.name"></h3>
                            <p data-i18n="languages.portuguese.level"></p>
                        </div>
                    </div>
                    <div class="LanguageDivider"></div>
                    <p class="LanguageDescription" data-i18n="languages.portuguese.description" ></p>
                </div>

                <div class="LanguageCard">
                    <div class="LanguagePrimary">
                        <img class="LanguageFlag" src="images/USAIcon.png" alt="USA icon" >
                        <div class="LanguageInfo">
                            <h3 data-i18n="languages.english.name"></h3>
                            <p data-i18n="languages.english.level"></p>
                        </div>
                    </div>
                    <div class="LanguageDivider"></div>
                    <p class="LanguageDescription" data-i18n="languages.english.description" ></p>
                </div>

                <div class="LanguageCard">
                    <div class="LanguagePrimary">
                        <img class="LanguageFlag" src="images/JapanIcon.png" alt="Japan icon" >
                        <div class="LanguageInfo">
                            <h3 data-i18n="languages.japanese.name"></h3>
                            <p data-i18n="languages.japanese.level"></p>
                        </div>
                    </div>
                    <div class="LanguageDivider"></div>
                    <p class="LanguageDescription" data-i18n="languages.japanese.description" ></p>
                </div>
        </section>

        <section id="education" class="ContentSection">
            <h2 data-i18n="sections.education"></h2>
            <div class="EducationCard">
                <div class="EducationPrimary">
                    <img class="EducationLogo" src="images/SenaiScLogo.jpg" alt="SENAI/SC" >
                    <div class="EducationInfo">
                        <h3 data-i18n="education.senai.name"></h3>
                    </div>
                </div>
                <div class="EducationDivider"></div>
                <div class="EducationDetails">
                    <p class="EducationDescription" data-i18n="education.bachelor.description" ></p>
                    <p class="EducationPeriod" data-i18n="education.bachelor.period"></p>
                </div>
            </div>

            <div class="EducationCard">
                <div class="EducationPrimary">
                    <img class="EducationLogo" src="images/SenaiScLogo.jpg" alt="SENAI/SC" >
                    <div class="EducationInfo">
                        <h3 data-i18n="education.senai.name"></h3>
                    </div>
                </div>
                <div class="EducationDivider"></div>
                <div class="EducationDetails">
                    <p class="EducationDescription" data-i18n="education.ittechnician.description" ></p>
                    <p class="EducationPeriod" data-i18n="education.ittechnician.period"></p>
                </div>
            </div>

            <div class="EducationCard">
                <div class="EducationPrimary">
                    <img class="EducationLogo" src="images/SenaiScLogo.jpg" alt="SENAI/SC" >
                    <div class="EducationInfo">
                        <h3 data-i18n="education.senai.name"></h3>
                    </div>
                </div>
                <div class="EducationDivider"></div>
                <div class="EducationDetails">
                    <p class="EducationDescription" data-i18n="education.highschool.description" ></p>
                    <p class="EducationPeriod" data-i18n="education.highschool.period"></p>
                </div>
            </div>
        </section>

        <section id="projects" class="ContentSection"> <h2 data-i18n="sections.projects"></h2> </section>

        <section id="contact" class="ContentSection">
            <h2 data-i18n="sections.contact"></h2>
            <p class="ContactDescription" data-i18n="contact.description"></p>
            <div class="ContactEmails">
                <div class="EmailCard">
                    <p class="EmailAddress">mnogueira030@gmail.com</p>
                    <button type="button" class="CopyButton" data-i18n-aria-label="contact.copyEmail" aria-label="Copiar email">
                        <svg class="CopyIcon" viewBox="0 0 24 24" aria-hidden="true" >
                            <path d="M8 8h10v10H8z" fill="none" stroke="currentColor" stroke-width="2" ></path>
                            <path d="M6 16H4V4h12v2" fill="none" stroke="currentColor" stroke-width="2" ></path>
                        </svg>
                    </button>
                </div>

                <div class="EmailCard">
                    <p class="EmailAddress">noguerateus@gmail.com</p>
                    <button type="button" class="CopyButton" data-i18n-aria-label="contact.copyEmail" aria-label="Copiar email" >
                        <svg class="CopyIcon" viewBox="0 0 24 24" aria-hidden="true" >
                            <path d="M8 8h10v10H8z" fill="none" stroke="currentColor" stroke-width="2" ></path>
                            <path d="M6 16H4V4h12v2" fill="none" stroke="currentColor" stroke-width="2" ></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="SocialLinks">
                <a class="SocialCard LinkedInCard" href="https://www.linkedin.com/in/mateus-nogueira-b3b5a614b/" target="_blank" rel="noopener noreferrer">
                    <div class="SocialIconCircle">
                        <svg class="SocialIcon" viewBox="0 0 24 24" aria-hidden="true" >
                            <path fill="currentColor" d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.32 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.1 20.45H3.54V9H7.1v11.45z"></path>
                        </svg>
                    </div>
                    <p>LinkedIn</p>
                </a>
                <a class="SocialCard GitHubCard" href="https://github.com/MateusNoguera" target="_blank" rel="noopener noreferrer" >
                    <div class="SocialIconCircle">
                        <svg class="SocialIcon" viewBox="0 0 24 24" aria-hidden="true" >
                            <path fill="currentColor" d="M12 2C6.48 2 2 6.58 2 12.23c0 4.52 2.87 8.35 6.84 9.7.5.1.68-.22.68-.49 0-.24-.01-1.05-.01-1.9-2.78.62-3.37-1.21-3.37-1.21-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .07 1.53 1.05 1.53 1.05.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.36-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.4 9.4 0 0 1 12 6.93a9.4 9.4 0 0 1 2.5.35c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.8-4.57 5.06.36.32.68.94.68 1.89 0 1.36-.01 2.46-.01 2.8 0 .27.18.59.69.49A10.24 10.24 0 0 0 22 12.23C22 6.58 17.52 2 12 2z"></path>
                        </svg>
                    </div>
                    <p>GitHub</p>

            </div>
        </section>
    </main>

    <footer class="Footer">
        <p class="FooterDevName" data-i18n="main.dev.name"></p>
    <p data-i18n="footer.rights"></p>
    </footer>

    <script src="js/functions.js"></script>
</body>
</html>
