<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/main.css">

    <title data-i18n="site.title"></title>
</head>

<body>
    <header class="Header">
        <a class="Logo" href="#home">MN</a>

        <nav class="HeaderNav" aria-label="Navegação principal">
            <a href="#about" data-i18n="header.about"></a>
            <a href="#experience" data-i18n="header.experience"></a>
            <a href="#projects" data-i18n="header.projects"></a>
            <a href="#contact" data-i18n="header.contact"></a>
        </nav>

        <div class="HeaderControls">
            <div class="ControlGroup">
                <button
                    type="button"
                    class="ControlButton ThemeButton"
                    data-theme="light"
                    aria-label="Usar tema claro"
                >
                    ☀
                </button>

                <button
                    type="button"
                    class="ControlButton ThemeButton"
                    data-theme="dark"
                    aria-label="Usar tema escuro"
                >
                    ☾
                </button>
            </div>

            <div class="ControlGroup">
                <button
                    type="button"
                    class="ControlButton LanguageButton"
                    data-language="ptbr"
                >
                    PT
                </button>

                <button
                    type="button"
                    class="ControlButton LanguageButton"
                    data-language="en"
                >
                    EN
                </button>
            </div>
        </div>
    </header>

    <main>
        <section id="home" class="HeroSection">
            <p class="HeroRole" data-i18n="hero.role"></p>

            <h1>Mateus Nogueira</h1>

            <p class="HeroDescription" data-i18n="hero.description"></p>

            <div class="HeroActions">
                <a
                    class="PrimaryButton"
                    href="#projects"
                    data-i18n="hero.projects"
                ></a>

                <a
                    class="SecondaryButton"
                    href="#contact"
                    data-i18n="hero.contact"
                ></a>
            </div>
        </section>

        <section id="about" class="ContentSection">
            <div class="SectionTitle">
                <span>01</span>
                <h2 data-i18n="sections.about"></h2>
            </div>

            <div class="AboutContent">
                <p class="AboutDescription" data-i18n="about.description"></p>

                <div class="Technologies">
                    <span>JavaScript</span>
                    <span>Node.js</span>
                    <span>Python</span>
                    <span>C#</span>
                    <span>C++</span>
                    <span>Unity</span>
                    <span>Unreal Engine</span>
                    <span>Qlik Sense</span>
                </div>
            </div>
        </section>
    </main>

    <script src="js/functions.js"></script>
</body>
</html>
